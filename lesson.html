<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Bài học</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
  font-family: Arial;
  background: #f5f7fb;
  padding: 20px;
}

.container {
  max-width: 900px;
  margin: auto;
  background: white;
  padding: 30px;
  border-radius: 12px;
}

button {
  padding: 12px 20px;
  border: none;
  border-radius: 8px;
  background: gray;
  color: white;
  cursor: not-allowed;
}

button.active {
  background: green;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="container">
  <h1 id="title">Bài học</h1>

  <video id="video" width="100%" controls>
    <source src="loikhuyenchuyengia.mp4" type="video/mp4">
    Trình duyệt của bạn không hỗ trợ video.
  </video>

  <br><br>

  <button id="submitBtn" disabled onclick="submitLesson()">
    Nộp bài
  </button>
</div>

<script>
const SUPABASE_URL = "https://zpvhxuwwgrtqbgziylbl.supabase.co";
const SUPABASE_KEY = "sb_publishable_u0kVgF9XCLTk5tD9M_xj9w_9lKguAgf";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// 🔥 CHECK LOGIN
const student_id = localStorage.getItem("student_id");
const role = localStorage.getItem("role");

if (!student_id || role !== "student") {
  alert("Vui lòng đăng nhập học sinh để xem bài học!");
  window.location.href = "login.html";
}

// 🔥 LẤY lesson_id
const params = new URLSearchParams(window.location.search);
const lesson_id = params.get("id");

if (!lesson_id) {
  alert("Lesson không xác định!");
  window.location.href = "index.html";
}

// 🔥 VIDEO CONTROL
const video = document.getElementById("video");
const btn = document.getElementById("submitBtn");

let lastTime = 0;
let completed = false;

// 🔥 CHỐNG tua nhanh (chỉ cho tua lùi)
video.addEventListener("seeking", () => {
  if (video.currentTime > lastTime) {
    video.currentTime = lastTime;
  }
});

// 🔥 CẬP NHẬT tiến trình
video.addEventListener("timeupdate", async () => {
  lastTime = Math.max(lastTime, video.currentTime);
  const percent = (lastTime / video.duration) * 100;

  if (percent >= 90 && !completed) {
    completed = true;
    btn.disabled = false;
    btn.classList.add("active");
    console.log("✅ Đã xem đủ video");

    // 🔥 Lưu lesson_progress
    try {
      const { error } = await sb.from("lesson_progress").upsert({
        student_id,
        lesson_id,
        duration: Math.floor(lastTime),
        completed: true
      });
      if (error) console.error("Lỗi lesson_progress:", error);
    } catch (err) {
      console.error(err);
    }
  }
});

// 🔥 NỘP BÀI
async function submitLesson() {
  try {
    // 🔥 Lưu trạng thái nộp bài
    const { error } = await sb.from("submissions").upsert({
      student_id,
      lesson_id,
      submitted: true,
      submit_time: new Date().toISOString()
    });
    if (error) throw error;

    alert("🎉 Nộp bài thành công!");
    window.location.href = "main.html";

  } catch (err) {
    console.error(err);
    alert("❌ Lỗi khi nộp bài, thử lại!");
  }
}
</script>

</body>
</html>
